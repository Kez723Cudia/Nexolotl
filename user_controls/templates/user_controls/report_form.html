<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit a Report | NEXOLOTL</title>
</head>
<body>
    <h1>Submit a Report</h1>

    {% if reported_user %}
        <p>Reporting account: {{ reported_user.username }}</p>
    {% elif reported_post %}
        <p>Reporting a post by: {{ reported_post.author.username }}</p>
        <p>{{ reported_post.content }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Submit Report</button>
    </form>

    <p><a href="/">Cancel</a></p>
</body>
</html>
