{% extends "accounts/base.html" %}
{% block content %}
  <div class="container mt-4">
    <h2>Login to Nexolotl</h2>
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

        <form method="post" autocomplete="off">
        {% csrf_token %}
        <div class="mb-3">
            <label for="identifier" class="form-label">Email or Phone</label>
            <input type="text" name="identifier" class="form-control" autocomplete="off" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" class="form-control" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
        </form>

    <p class="mt-3">Don't have an account yet? 
      <a href="{% url 'register' %}" class="btn btn-link">Sign Up</a>
    </p>
  </div>
{% endblock %}
