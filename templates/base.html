{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="{{ request.user.theme|default:'classic' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nexolotl{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Silkscreen:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}?v=3">
  <link rel="stylesheet" href="{% static 'css/nexolotl.css' %}?v=2">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include 'partials/_navbar.html' %}
  <main class="nx-container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
