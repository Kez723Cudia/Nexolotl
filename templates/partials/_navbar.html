{% load static %}

<nav class="nx-nav">
    <a href="{% url 'post_feed' %}" class="nx-logo">
        <img
            class="nx-logo__mark"
            src="{% static 'img/nexolotl-logo.png' %}"
            alt=""
        >
        <span class="nx-logo__word">NEXOLOTL</span>
    </a>

    <div class="nx-nav__links">
        <a href="{% url 'post_feed' %}">
            Home
        </a>

        {% if user.is_authenticated %}
            <a href="{% url 'profile' username=user.username %}">
                Profile
            </a>
        {% endif %}
    </div>

    <div class="nx-nav__actions">
        {% if user.is_authenticated %}

            <a
                href="{% url 'profile' username=user.username %}"
                class="nx-nav__profile"
                aria-label="Your profile"
            >
                {% if user.profile.avatar %}
                    <img
                        src="{{ user.profile.avatar.url }}"
                        alt="{{ user.username }}"
                        class="nx-avatar nx-avatar--sm"
                    >
                {% else %}
                    <span class="nx-avatar-placeholder">
                        {{ user.username|first|upper }}
                    </span>
                {% endif %}
            </a>

            <a
                href="{% url 'logout' %}"
                class="nx-btn nx-btn--ghost"
            >
                Log out
            </a>

        {% else %}

            <a href="{% url 'login' %}" class="nx-btn">
                Log in
            </a>

            <a href="{% url 'register' %}" class="nx-btn nx-btn--ghost">
                Sign up
            </a>

        {% endif %}
    </div>
</nav>
